name: IOE Run

on:
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    - run: pip install webdriver-manager groq selenium
    - name: Run Bot
      env:
        IOE_USERNAME: ${{ secrets.IOE_USERNAME }}
        IOE_PASSWORD: ${{ secrets.IOE_PASSWORD }}
        PROXY_SERVER: ${{ secrets.PROXY_SERVER }}
        GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      run: python bot.py
